[pytest]
# Certains fichiers de tests se terminent par un `return` (petit dict/texte)
# utilisé par leur lanceur maison (fonction main(), exécutée en direct avec
# python3) pour afficher le détail de chaque scénario. C'est voulu : pytest
# n'en a pas besoin, d'où ce filtre ciblé sur ce seul avertissement — voir
# ARCHITECTURE.md.
filterwarnings =
    ignore::pytest.PytestReturnNotNoneWarning
