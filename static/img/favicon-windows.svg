<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Favicon Bridge_Agent (Windows) : rond bleu Windows (#0078D4) pour distinguer
       l'onglet quand new_issue.py tourne nativement sur Windows (issue #687) —
       même forme de pont stylisé que favicon.svg (Linux, rouge), seule la couleur change. -->
  <circle cx="16" cy="16" r="15" fill="#0078D4"/>
  <!-- Pont stylisé blanc : tablier + deux arches -->
  <g fill="none" stroke="#FBEEEC" stroke-width="2" stroke-linecap="round">
    <line x1="6" y1="20" x2="26" y2="20"/>
    <path d="M6 20 Q11 12 16 20"/>
    <path d="M16 20 Q21 12 26 20"/>
  </g>
</svg>
